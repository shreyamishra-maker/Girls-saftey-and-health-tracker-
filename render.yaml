services:
  - type: web
    name: girls-safety-health-tracker
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_PATH
        value: /var/data/girls_safety.db
      - key: FLASK_DEBUG
        value: "0"
    disk:
      name: girls-safety-data
      mountPath: /var/data
      sizeGB: 1
